server {
    listen 80;
    server_name _;

    # Docker 内置 DNS（用于变量方式 proxy_pass 的动态域名解析）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源 + history 路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端服务（compose 内部网络用服务名 backend）
    location /api/ {
        # 用变量方式指定 upstream：nginx 运行时动态解析（配合 Docker 内置 DNS），
        # 避免静态配置在启动阶段解析失败（backend 容器尚未就绪时直接 fatal），
        # 且 backend 容器重建（IP 变化）时无需重启 nginx
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # === SSE 流式输出的关键配置 ===
        # 关闭代理缓冲：nginx 默认缓冲响应，会导致 AI 回答攒一批才推给浏览器，
        # 关闭后 token 逐字到达前端
        proxy_buffering off;
        proxy_cache off;
        # 流式长连接超时（AI 生成可能耗时数十秒）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
